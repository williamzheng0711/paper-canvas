name: Publish public downloads

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Release desktop installers
    types:
      - completed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare public download site
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check out site template
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Download latest installers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mkdir -p site/download
          gh release download \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "PaperCanvas-Windows-x64-Setup.exe" \
            --pattern "PaperCanvas-macOS-universal.dmg" \
            --dir site/download \
            --clobber

          test -s site/download/PaperCanvas-Windows-x64-Setup.exe
          test -s site/download/PaperCanvas-macOS-universal.dmg

          cp docs/downloads/index.html site/index.html
          cp src-tauri/icons/128x128.png site/icon.png
          touch site/.nojekyll

          cd site/download
          sha256sum \
            PaperCanvas-Windows-x64-Setup.exe \
            PaperCanvas-macOS-universal.dmg \
            > SHA256SUMS.txt

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    name: Deploy public download site
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  verify-windows:
    name: Verify public Windows installer
    needs: deploy
    runs-on: windows-latest
    steps:
      - name: Download, install, and launch PaperCanvas
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "PaperCanvas-Windows-x64-Setup.exe"
          $downloadUrl = "https://williamzheng0711.github.io/paper-canvas/download/PaperCanvas-Windows-x64-Setup.exe"

          Invoke-WebRequest -Uri $downloadUrl -OutFile $installer
          if ((Get-Item $installer).Length -lt 1MB) {
            throw "The public Windows installer is unexpectedly small."
          }

          $installation = Start-Process -FilePath $installer -ArgumentList "/S" -Wait -PassThru
          if ($installation.ExitCode -ne 0) {
            throw "The Windows installer exited with code $($installation.ExitCode)."
          }

          $uninstallEntries = @(
            "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*",
            "HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*"
          )
          $paperCanvas = Get-ItemProperty $uninstallEntries -ErrorAction SilentlyContinue |
            Where-Object { $_.DisplayName -eq "PaperCanvas" } |
            Select-Object -First 1

          if (-not $paperCanvas) {
            throw "PaperCanvas was not registered as an installed application."
          }

          $application = Get-ChildItem -LiteralPath $paperCanvas.InstallLocation |
            Where-Object {
              -not $_.PSIsContainer -and
              $_.Extension -eq ".exe" -and
              $_.Name -notmatch "uninstall"
            } |
            Select-Object -First 1
          if (-not $application) {
            throw "The installed PaperCanvas executable was not found."
          }

          $process = Start-Process -FilePath $application.FullName -PassThru
          Start-Sleep -Seconds 10
          if ($process.HasExited) {
            throw "PaperCanvas exited during its launch smoke test with code $($process.ExitCode)."
          }

          Stop-Process -Id $process.Id -Force
